[mod-name]
ore-patch-restrictions=Ore is for Mining

[mod-description]
ore-patch-restrictions=Ore is for mining. Only drills, belts, inserters, beacons, poles and pipes can be built on resource patches. Everything else, find your own land.

[mod-setting-name]
opr-allow-rails=Allow rails on resource patches
opr-allow-splitters=Allow splitters on resource patches
opr-include-fluid-resources=Also apply to oil and other fluid resources
opr-extra-allowed-entities=Extra allowed entities

[mod-setting-description]
opr-allow-rails=Allows rails, rail ramps, rail supports, rail signals and train stops. Elevated rails can always pass over resource patches.
opr-allow-splitters=Allows splitters and lane splitters (on by default).
opr-include-fluid-resources=On: crude oil spots (and lithium brine, fluorine vents and sulfuric acid geysers in Space Age) follow the same rules as ore, so only pumpjacks, pipes and the other allowed buildings can be placed on them.\nOff: only solid ores are restricted, and anything can be built on fluid resources.
opr-extra-allowed-entities=Comma-separated entity names that may also be built on resource patches, e.g. small-lamp, radar, wooden-chest.
